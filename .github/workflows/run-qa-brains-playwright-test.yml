name: Run QA Brains Playwright Tests

on:
  workflow_call:
    inputs:
      commit_message:
        required: false
        type: string
      event_type:
        required: false
        type: string
    secrets:
      HEADLESS_SCREEN_WIDTH:
        required: true
      HEADLESS_SCREEN_HEIGHT:
        required: true
      HEADLESS:
        required: true
      QA_BRAINS_URL:
        required: true
      EMAIL:
        required: true
      PASSWORD:
        required: true

jobs:
  playwright-docker:
    runs-on: ubuntu-latest

    outputs:
      result_status: ${{ steps.login_test.outputs.result_status }}
      passed: ${{ steps.login_test.outputs.passed }}
      failed: ${{ steps.login_test.outputs.failed }}
      total: ${{ steps.login_test.outputs.total }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-test:latest .

      - name: Create .env file for Docker
        run: |
          echo "HEADLESS_SCREEN_WIDTH=${{ secrets.HEADLESS_SCREEN_WIDTH }}" >> .env
          echo "HEADLESS_SCREEN_HEIGHT=${{ secrets.HEADLESS_SCREEN_HEIGHT }}" >> .env
          echo "HEADLESS=${{ secrets.HEADLESS }}" >> .env
          echo "QA_BRAINS_URL=${{ secrets.QA_BRAINS_URL }}" >> .env
          echo "EMAIL=${{ secrets.EMAIL }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
        shell: bash

      - name: Run Playwright tests inside Docker
        id: login_test
        continue-on-error: true
        run: |
          sed -i 's/\r$//' .github/scripts/run-playwright-tests.sh
          bash .github/scripts/run-playwright-tests.sh

      - name: Upload Test Results
        if: |
          always() &&
          fromJSON(needs.playwright-docker.outputs.failed) > 0
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            reports/allure-report
            reports/test_summary.txt
            reports/playwright.log

  ai-failure-analysis:
    runs-on: ubuntu-latest
    steps:

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: reports

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

      - name: Pull AI Model
        run: |
          ollama pull llama3.2:3b

      - name: AI Failure Analysis
        id: ai_analysis
        run: |
          SUMMARY=$(cat reports/test_summary.txt 2>/dev/null || echo "No test summary available")
          LOGS=$(tail -n 500 reports/playwright.log 2>/dev/null || echo "No Playwright logs available")

          PROMPT=$(cat <<EOF
          You are a QA automation failure analysis expert.

          Analyze the following Playwright test failure.

          TEST SUMMARY:
          $SUMMARY

          PLAYWRIGHT LOGS:
          $LOGS

          Provide:

          1. Root Cause
          2. Failed Test
          3. Failure Category
          4. Evidence
          5. Recommended Fix
          6. Whether this looks like:
             - Application bug
             - Automation/script bug
             - Test data issue
             - Environment issue
             - Network issue
             - Timing/wait issue
             - Unknown

          Keep the answer concise and useful for a QA engineer.
          EOF
          )

          AI_RESPONSE=$(curl -s http://localhost:11434/api/generate \
            -d "$(jq -n \
              --arg model "llama3.2:3b" \
              --arg prompt "$PROMPT" \
              '{model: $model, prompt: $prompt, stream: false}')")

          echo "$AI_RESPONSE" | jq -r '.response' > reports/ai_analysis.txt

          echo "===== AI ANALYSIS ====="
          cat reports/ai_analysis.txt

      - name: Upload AI Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: reports/ai_analysis.txt

  send-slack-card:
    runs-on: ubuntu-latest
    needs:
      - playwright-docker
      - ai-failure-analysis
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AI Analysis
        if: needs.playwright-docker.outputs.failed > 0
        uses: actions/download-artifact@v4
        with:
          name: ai-analysis
          path: reports

      - name: Send Slack Adaptive Card
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_HASH: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          ACTOR: ${{ github.actor }}
          RESULT_STATUS: ${{ needs.playwright-docker.outputs.result_status }}
          PASSED: ${{ needs.playwright-docker.outputs.passed }}
          FAILED: ${{ needs.playwright-docker.outputs.failed }}
          TOTAL: ${{ needs.playwright-docker.outputs.total }}
          DATE_TIME: ${{ github.event.head_commit.timestamp || github.event.pushed_at || github.event.workflow_run.created_at }}
        run: bash .github/scripts/send-slack-card.sh
